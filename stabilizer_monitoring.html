<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Firm Name - Energy Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .header { background: #003366; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card h3 { margin: 0; color: #666; font-size: 14px; }
    .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #003366; }
  </style>

  <!-- Firebase JavaScript SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Custom Firm Header -->
  <div class="header">
    <h2>🏢 YOUR FIRM NAME</h2>
    <span id="status" style="color: #ff4d4d; font-weight: bold;">Offline</span>
  </div>

  <!-- Live Monitoring Cards -->
  <div class="grid">
    <div class="card">
      <h3>VOLTAGE</h3>
      <p id="voltage">0 V</p>
    </div>
    <div class="card">
      <h3>CURRENT</h3>
      <p id="current">0 A</p>
    </div>
    <div class="card">
      <h3>ACTIVE POWER</h3>
      <p id="power">0 W</p>
    </div>
    <div class="card">
      <h3>TOTAL CONSUMPTION</h3>
      <p id="energy">0 kWh</p>
    </div>
  </div>

  <script>
    // Replace with your Firebase Project Configuration
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "your-project-id.firebaseapp.com",
      databaseURL: "https://your-project-id-default-rtdb.firebaseio.com",
      projectId: "your-project-id",
      storageBucket: "your-project-id.appspot.com",
      messagingSenderId: "1234567890",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Read live data sent by ESP32
    db.ref("Energy").on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById("voltage").innerText = (data.voltage || 0) + " V";
        document.getElementById("current").innerText = (data.current || 0) + " A";
        document.getElementById("power").innerText = (data.power || 0) + " W";
        document.getElementById("energy").innerText = (data.energy || 0) + " kWh";
        
        document.getElementById("status").innerText = "Online";
        document.getElementById("status").style.color = "#00ff88";
      }
    });
  </script>
</body>
</html>
